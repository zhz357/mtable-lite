<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="icon">💣</span>扫雷</div>
    <div class="levels" id="levels">
      <button data-level="easy">初级 9×9</button>
      <button data-level="medium">中级 16×16</button>
      <button data-level="hard">高级 30×16</button>
      <button data-level="custom">自定义</button>
    </div>
  </div>

  <div class="hud">
    <div class="hud-item">
      <div class="label">剩余地雷</div>
      <div class="counter" id="mineCounter">000</div>
    </div>
    <button class="face" id="face" title="重新开始">🙂</button>
    <div class="hud-item">
      <div class="label">用时（秒）</div>
      <div class="counter time" id="timer">000</div>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="status">
    <span id="status"></span>
    <span class="best-tag" id="best"></span>
  </div>
</div>

<div class="modal hidden" id="customModal">
  <div class="modal-card">
    <h3>自定义难度</h3>
    <div class="field">
      <label>行数（5 ~ 30）</label>
      <input type="number" id="customRows" min="5" max="30" value="9">
    </div>
    <div class="field">
      <label>列数（5 ~ 30）</label>
      <input type="number" id="customCols" min="5" max="30" value="9">
    </div>
    <div class="field">
      <label>地雷数（至少 1，且不超过 行数×列数−1）</label>
      <input type="number" id="customMines" min="1" value="10">
    </div>
    <div class="modal-error" id="customError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="customCancel">取消</button>
      <button class="btn-ok" id="customOk">开始游戏</button>
    </div>
  </div>
</div>

<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
